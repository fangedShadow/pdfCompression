<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Compressor</title>
  <style>
    :root { color-scheme: light; --ink: #1c2421; --muted: #65716c; --paper: #f4f2eb; --mint: #c8e8d8; --line: #d7ddd7; --accent: #176b50; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 85% 10%, #dbeee4 0, transparent 35%), var(--paper); color: var(--ink); font: 16px/1.5 Georgia, serif; }
    main { width: min(720px, calc(100% - 32px)); margin: 8vh auto; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.02; }
    p { color: var(--muted); }
    section { background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 8px; padding: clamp(20px,5vw,36px); box-shadow: 0 18px 50px rgba(28,36,33,.08); }
    label { display: block; margin: 16px 0 7px; font-weight: bold; }
    input { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 12px; background: #fff; color: var(--ink); }
    button { margin-top: 22px; border: 0; border-radius: 5px; padding: 13px 18px; background: var(--accent); color: #fff; cursor: pointer; font: bold 16px Georgia, serif; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 28px; margin-top: 22px; color: var(--accent); font-weight: bold; }
    #result { display: none; margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
    .stat { padding: 12px; background: var(--mint); border-radius: 5px; }
    .stat small { display: block; color: var(--muted); }
    .stat strong { font-size: 1.2rem; }
    a { color: var(--accent); font-weight: bold; }
    @media (max-width: 540px) { .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>PDF Compressor</h1>
    <p>Compress a PDF and download the result.</p>
    <section>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" placeholder="Enter your API key" autocomplete="off">
      <label for="file">PDF file</label>
      <input id="file" type="file" accept="application/pdf,.pdf">
      <button id="compress" type="button">Compress PDF</button>
      <div id="status" role="status"></div>
      <div id="result">
        <div class="stats">
          <div class="stat"><small>Original</small><strong id="original">-</strong></div>
          <div class="stat"><small>Compressed</small><strong id="compressed">-</strong></div>
          <div class="stat"><small>Reduction</small><strong id="reduction">-</strong></div>
        </div>
        <a id="download" download>Download compressed PDF</a>
      </div>
    </section>
  </main>
  <script>
    const fileInput = document.querySelector('#file');
    const button = document.querySelector('#compress');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    const formatBytes = (bytes) => bytes < 1048576 ? `${(bytes / 1024).toFixed(1)} KB` : `${(bytes / 1048576).toFixed(2)} MB`;
    button.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { status.textContent = 'Choose a PDF first.'; return; }
      button.disabled = true; result.style.display = 'none'; status.textContent = 'Compressing...';
      const form = new FormData(); form.append('file', file, file.name);
      try {
        const response = await fetch('/api/compress', { method: 'POST', headers: { 'x-api-key': document.querySelector('#apiKey').value }, body: form });
        if (!response.ok) { const error = await response.json().catch(() => ({})); throw new Error(error.error?.message || `API returned ${response.status}`); }
        const blob = await response.blob();
        document.querySelector('#original').textContent = formatBytes(file.size);
        document.querySelector('#compressed').textContent = formatBytes(blob.size);
        document.querySelector('#reduction').textContent = `${((1 - blob.size / file.size) * 100).toFixed(1)}%`;
        const download = document.querySelector('#download'); download.href = URL.createObjectURL(blob); download.download = response.headers.get('content-disposition')?.match(/filename="([^"]+)/)?.[1] || `compressed_${file.name}`;
        result.style.display = 'block'; status.textContent = 'Compression complete.';
      } catch (error) { status.textContent = error.message === 'Failed to fetch' ? 'The compression service could not be reached.' : error.message; } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
